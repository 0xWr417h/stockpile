name: 'ADCS Multi-ESC Sweep (ESC1-4)'
description: |
  Breadth demo. Enumerate once, then attempt every supported ESC branch
  (ESC1-4). Each branch fires only if the enumeration found a template of that
  class, so the planner self-selects the applicable paths. All successful
  branches feed the shared UnPAC-the-hash step. ESC2/ESC4 are marked validate in
  their ability descriptions; ESC4 modifies and restores a template.
